<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lowlight — Image Enhancement</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #111; background: #fafafa; }
    .wrap { max-width: 920px; margin: 0 auto; padding: 34px 20px 60px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 70px; }
    .brand { font-size: 18px; font-weight: 700; letter-spacing: -.03em; }
    .docs { color: #666; text-decoration: none; font-size: 14px; }
    .docs:hover { color: #111; }
    h1 { font-size: clamp(38px, 7vw, 68px); line-height: .98; letter-spacing: -.06em; font-weight: 600; margin: 0 0 16px; max-width: 700px; }
    .sub { color: #666; font-size: 17px; margin: 0 0 38px; }
    .drop { border: 1px dashed #aaa; background: #fff; min-height: 220px; display: grid; place-items: center; text-align: center; padding: 30px; cursor: pointer; transition: .15s ease; }
    .drop:hover, .drop.over { border-color: #111; background: #f5f5f5; }
    .drop strong { display: block; font-size: 16px; margin-bottom: 7px; }
    .drop span { color: #777; font-size: 14px; }
    input { display: none; }
    button { border: 0; background: #111; color: #fff; padding: 13px 20px; font-size: 14px; cursor: pointer; margin-top: 14px; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .status { min-height: 24px; margin: 17px 0 0; color: #666; font-size: 14px; }
    .error { color: #b42318; }
    .result { display: none; margin-top: 58px; }
    .result h2 { font-size: 18px; font-weight: 600; margin: 0 0 18px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    figure { margin: 0; background: #fff; border: 1px solid #e8e8e8; }
    figure img { width: 100%; display: block; max-height: 520px; object-fit: contain; background: #f1f1f1; }
    figcaption { padding: 11px 13px; font-size: 13px; color: #666; }
    .meta { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-top: 18px; }
    .score { font-size: 14px; color: #555; }
    .score b { color: #111; }
    .download { display: inline-block; text-decoration: none; background: #111; color: #fff; padding: 12px 17px; font-size: 14px; }
    footer { margin-top: 70px; color: #999; font-size: 12px; }
    @media (max-width: 650px) { header { margin-bottom: 50px; } .grid { grid-template-columns: 1fr; } .meta { align-items: flex-start; flex-direction: column; } }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="brand">LOWLIGHT</div>
      <a class="docs" href="/docs" target="_blank">API docs</a>
    </header>

    <section>
      <h1>Enhance dark images.</h1>
      <p class="sub">Upload an image and let the pipeline handle the rest.</p>

      <label class="drop" id="drop">
        <input id="file" type="file" accept="image/*">
        <div>
          <strong id="fileText">Drop an image here</strong>
          <span>or click to choose a file</span>
        </div>
      </label>

      <button id="enhance" disabled>Enhance</button>
      <div class="status" id="status"></div>
    </section>

    <section class="result" id="result">
      <h2>Result</h2>
      <div class="grid">
        <figure><img id="original"><figcaption>Original</figcaption></figure>
        <figure><img id="output"><figcaption>Enhanced</figcaption></figure>
      </div>
      <div class="meta">
        <div class="score" id="score"></div>
        <a class="download" id="download" download="enhanced-image.jpg">Download</a>
      </div>
    </section>

    <footer>Agentic low-light image enhancement and denoising.</footer>
  </main>

  <script>
    const fileInput = document.getElementById('file');
    const drop = document.getElementById('drop');
    const enhanceBtn = document.getElementById('enhance');
    const status = document.getElementById('status');
    const fileText = document.getElementById('fileText');
    const result = document.getElementById('result');
    const original = document.getElementById('original');
    const output = document.getElementById('output');
    const download = document.getElementById('download');
    const score = document.getElementById('score');
    let selectedFile = null;
    let originalUrl = null;
    let outputUrl = null;

    function setFile(file) {
      if (!file || !file.type.startsWith('image/')) {
        status.textContent = 'Please choose an image file.';
        status.className = 'status error';
        return;
      }
      selectedFile = file;
      fileText.textContent = file.name;
      enhanceBtn.disabled = false;
      status.textContent = '';
      status.className = 'status';
      if (originalUrl) URL.revokeObjectURL(originalUrl);
      originalUrl = URL.createObjectURL(file);
      original.src = originalUrl;
      result.style.display = 'none';
    }

    fileInput.addEventListener('change', () => setFile(fileInput.files[0]));
    ['dragenter', 'dragover'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add('over'); }));
    ['dragleave', 'drop'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove('over'); }));
    drop.addEventListener('drop', ev => setFile(ev.dataTransfer.files[0]));

    enhanceBtn.addEventListener('click', async () => {
      if (!selectedFile) return;
      enhanceBtn.disabled = true;
      status.textContent = 'Enhancing image…';
      status.className = 'status';
      const form = new FormData();
      form.append('file', selectedFile);
      try {
        const response = await fetch('/enhance', { method: 'POST', body: form });
        if (!response.ok) {
          let message = 'Enhancement failed.';
          try { const data = await response.json(); message = data.detail || message; } catch (_) {}
          throw new Error(message);
        }
        const blob = await response.blob();
        if (outputUrl) URL.revokeObjectURL(outputUrl);
        outputUrl = URL.createObjectURL(blob);
        output.src = outputUrl;
        download.href = outputUrl;
        const finalScore = response.headers.get('X-Final-Score');
        score.innerHTML = finalScore ? `Quality score: <b>${Number(finalScore).toFixed(1)}</b>` : '';
        result.style.display = 'block';
        status.textContent = 'Done.';
        result.scrollIntoView({ behavior: 'smooth', block: 'start' });
      } catch (err) {
        status.textContent = err.message || 'Something went wrong.';
        status.className = 'status error';
      } finally {
        enhanceBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
